[package]
name = "idle-app"
version = "0.1.0"
description = "idle-app"
authors = ["you"]
edition = "2021"

[lib]
name = "idle_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
